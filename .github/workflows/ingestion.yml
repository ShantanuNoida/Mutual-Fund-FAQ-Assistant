name: Scheduled Knowledge Base Refresh

on:
  schedule:
    # Runs at 04:30 UTC (10:00 AM IST) every day
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write # Required for committing and pushing the updated vector DB


jobs:
  refresh-kb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ingestion Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        # Ensure PYTHONPATH includes the necessary phase directories
        export PYTHONPATH=$PYTHONPATH:$(pwd)/Phase_1_Data_Ingestion/src:$(pwd)/Phase_2_RAG_Pipeline/src:$(pwd)/Phase_3_Guardrails/src
        python Phase_1_Data_Ingestion/src/ingestion.py

    - name: Commit and Push Updated Vector DB
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add Phase_1_Data_Ingestion/chroma_db/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Knowledge Base Refresh: $(date +'%Y-%m-%d')" && git push)
